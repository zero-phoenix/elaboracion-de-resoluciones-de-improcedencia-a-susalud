name: Build and Release Improcedencia Engine

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run Popperian Verification Suite
        run: |
          python scripts/verificar_improcedencia.py plantillas_maestras/plantilla_maestra_ipress.docx IPRESS TOTAL
          python scripts/verificar_improcedencia.py plantillas_maestras/plantilla_maestra_iafas.docx IAFAS TOTAL
          python scripts/verificar_improcedencia.py plantillas_maestras/plantilla_maestra_mixta_iafas_ipress.docx MIXTO TOTAL

      - name: Compile Standalone Executable
        run: |
          pyinstaller --clean improcedencia-engine.spec

      - name: Test Compiled Binary
        run: |
          ./dist/improcedencia-engine.exe info
          ./dist/improcedencia-engine.exe normas

      - name: Package Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/improcedencia-engine.exe
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
